name: 3D Genome Daily Digest

on:
  schedule:
    - cron: '3 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      id-token: write
      contents: write    # need write to commit sent_history.json
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TO_EMAIL: yanxu2077@gmail.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch bioRxiv preprints
        run: python fetch_papers.py > /tmp/biorxiv.json

      - name: Fetch PubMed journal articles
        run: python fetch_pubmed.py > /tmp/pubmed.json

      - name: Combine sources
        run: |
          python combine_sources.py > /tmp/papers.json
          python -c "import json; d=json.load(open('/tmp/papers.json')); print(f'combined: {d[\"count\"]} (window {d[\"window_utc\"]})')"

      - name: Claude picks paper + writes commentary
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 15 --model claude-sonnet-4-6 --allowed-tools "Read,Write,Bash"'
          prompt: |
            You are curating a daily preprint digest for a researcher in 3D genome organization, Micro-C, loop extrusion, and single-molecule chromatin biology (MIT). DO NOT mention "Hansen Lab" or "Hansen" anywhere in your output.

            Reader's research interests:
              * Micro-C and high-resolution (sub-kb / nucleosome) contact maps
              * CTCF, cohesin, loop extrusion mechanism
              * Single-molecule live-cell imaging (SPT, SMLM, lattice light sheet)
              * Transcription factor dynamics, chromatin binding kinetics
              * Polymer physics of chromatin, bridging-induced phase separation
              * RNA Pol II clusters / biomolecular condensates
              * TAD / loop / compartment / chromatin domain biology

            TASK:
            1. Read /tmp/papers.json — JSON: {window_utc, count, papers: [{title, authors, date, doi, url, category, abstract, source}]}. Papers come from bioRxiv (preprints) AND PubMed (journal articles). **Every paper's URL has been pre-validated as reachable (HTTP 2xx)** — you don't need to verify links.
            2. Read sent_history.json (in current working directory) — list of papers already emailed (each with `doi`). Exclude any paper whose `doi` matches an entry in sent_history (HARD requirement).
            3. From REMAINING candidates, semantically rank for the reader's interests. **BE HONEST. DO NOT INFLATE TIERS.** A Tier 4 day is a normal occurrence — most days have no Tier 1 papers.

               STRICT TIER DEFINITIONS:
               - **Tier 1**: Title OR abstract MUST contain explicit reference to 3D genome organization. Required keywords (one of these MUST appear): Hi-C, Micro-C, loop extrusion, cohesin (in chromatin context), CTCF, TAD/topologically associating domain, "3D genome", chromosome conformation, chromatin loop, A/B compartment, condensin (in chromatin context). The paper's CENTRAL contribution must be about chromatin spatial organization. Generic "chromatin remodeling" or "chromatin accessibility" alone DOES NOT qualify as Tier 1.

               - **Tier 2**: Paper's central topic is one of: single-molecule chromatin imaging (SPT/SMLM in nuclear context), biomolecular condensates IN nuclear/transcriptional context, transcription factor binding kinetics/dynamics, polymer physics modeling of chromatin, enhancer-promoter contacts/biology, RNA Pol II clustering. Must be CHROMATIN- or NUCLEUS-related, not generic biophysics or generic single-molecule methods.

               - **Tier 3**: Broader chromatin / gene regulation / nuclear organization without 3D structure focus (e.g., histone modifications, nucleosome biology without spatial focus, transcriptional regulation, ATAC-seq / ChIP-seq method papers).

               - **Tier 4**: Everything else — generic biophysics, generic cell biology, methods papers unrelated to chromatin, biology in non-chromatin contexts (mitochondria, membrane, actin, etc.). **THIS IS THE EXPECTED ANSWER MOST DAYS.** Do not inflate.

               Within a tier, prefer methods/tools > novel discoveries > incremental work.
            4. Pick exactly ONE paper that is NOT in sent_history.
               If literally every candidate is in sent_history, pick the most relevant one anyway and START the commentary with "（此前已推送过，但近 48h 内仍无更新候选）".

            5. Write THREE plain-text files (no JSON, no escaping needed):

               (a) /tmp/chosen_doi.txt — write EXACTLY the picked paper's `doi` field, nothing else (no quotes, no whitespace, no newline at end ideally — single line is fine).

               (b) /tmp/chosen_tier.txt — write a single digit: 1, 2, 3, or 4.

               (c) /tmp/chosen_commentary.txt — write your 2-3 sentence Chinese 点评:
                   * Briefly state the method/finding
                   * Concretely state WHY it's worth the reader's time given their focus
                   * Reference the experimental approach / resolution / system, and how it could inform or contrast Micro-C / single-molecule work
                   * Avoid generic phrases ("值得一读", "很有意思") — be concrete, technical
                   * 2-3 sentences MAX, tight prose
                   * DO NOT mention "Hansen Lab" or "Hansen"
                   Just the prose. No quotes around it. No JSON. No markdown headers. Plain text, can include 中文 / English / numbers freely.

            DO NOT send any email — a separate workflow step handles that. Just write the 3 files and finish.

      - name: Send email via Resend
        run: python send_email.py

      - name: Update sent history and push
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_history.py
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add sent_history.json
          if git diff --staged --quiet; then
            echo "no history change to commit"
          else
            git commit -m "log sent paper $(date -u +%FT%TZ)"
            # claude-code-action overwrote git auth — reset to GITHUB_TOKEN for push
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: python notify_failure.py
