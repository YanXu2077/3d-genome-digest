name: 3D Genome Daily Digest

on:
  schedule:
    - cron: '3 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      id-token: write
      contents: write    # need write to commit sent_history.json
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TO_EMAIL: yanxu2077@gmail.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch candidate preprints
        run: |
          python fetch_papers.py > /tmp/papers.json
          python -c "import json; d=json.load(open('/tmp/papers.json')); print(f'papers: {d[\"count\"]} (window {d[\"window_utc\"]})')"

      - name: Claude picks paper + writes commentary
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 15 --model claude-sonnet-4-6 --allowed-tools "Read,Write,Bash"'
          prompt: |
            You are curating a daily preprint digest for a researcher in 3D genome organization, Micro-C, loop extrusion, and single-molecule chromatin biology (MIT). DO NOT mention "Hansen Lab" or "Hansen" anywhere in your output.

            Reader's research interests:
              * Micro-C and high-resolution (sub-kb / nucleosome) contact maps
              * CTCF, cohesin, loop extrusion mechanism
              * Single-molecule live-cell imaging (SPT, SMLM, lattice light sheet)
              * Transcription factor dynamics, chromatin binding kinetics
              * Polymer physics of chromatin, bridging-induced phase separation
              * RNA Pol II clusters / biomolecular condensates
              * TAD / loop / compartment / chromatin domain biology

            TASK:
            1. Use the Read tool to read /tmp/papers.json — JSON: {window_utc, count, papers: [{title, authors, date, doi, url, category, abstract}]}.
            2. Use the Read tool to read sent_history.json (in current working directory) — list of papers already emailed to the reader (each with `doi` and `title`). **Exclude any paper whose `doi` matches an entry in sent_history.** This is a hard requirement — do NOT pick a paper already in the history.
            3. From REMAINING candidates, semantically rank for the reader's interests:
               - Tier 1 = directly 3D-genome / Hi-C / Micro-C / loop extrusion / cohesin / CTCF / TAD
               - Tier 2 = adjacent (single-molecule chromatin imaging, condensates, TF dynamics, polymer modeling, chromatin dynamics, enhancer-promoter biology)
               - Tier 3 = broader chromatin / gene regulation / nuclear organization
               - Tier 4 = nothing related — pick the most interesting biology paper as token reading
               Within a tier, prefer methods/tools > novel discoveries > incremental work.
            4. Pick exactly ONE paper that is NOT in sent_history.
               If literally every candidate is in sent_history (extremely rare — would mean the entire 48h pool has been previously emailed), pick the most relevant one even if previously sent, and START the commentary with "（此前已推送过，但近 48h 内仍无更新候选）".
            5. Write a 2-3 sentence Chinese 点评 that is SPECIFIC AND SUBSTANTIVE:
               - Briefly state the method/finding
               - Concretely state WHY it's worth the reader's time given their focus
               - Reference the experimental approach / resolution / system, and how it could inform or contrast Micro-C / single-molecule work
               - Avoid generic phrases ("值得一读", "很有意思") — be concrete, technical
               - 2-3 sentences MAX, tight prose
               - DO NOT mention "Hansen Lab" or "Hansen"
            6. Use the Write tool to create /tmp/chosen.json with EXACTLY this structure:
               {
                 "chosen": { ... copy the picked paper object verbatim from input (title, authors, date, doi, url, category, abstract) ... },
                 "tier": <1|2|3|4>,
                 "commentary_zh": "<your 2-3 sentence Chinese commentary>",
                 "subject": "[3D Genome Daily] <chosen paper title — keep full or truncate naturally to ~80 chars>"
               }

            DO NOT send any email — a separate workflow step handles that. Just write /tmp/chosen.json and finish.

      - name: Send email via Resend
        run: python send_email.py

      - name: Update sent history and push
        if: success()
        run: |
          python update_history.py
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add sent_history.json
          if git diff --staged --quiet; then
            echo "no history change to commit"
          else
            git commit -m "log sent paper $(date -u +%FT%TZ)"
            git push
          fi
