name: 3D Genome Daily Digest

on:
  schedule:
    # Primary fire at :03 of every even hour (2h cadence): 00,02,04,...,22 UTC
    - cron: '3 */2 * * *'
    # Backup fire at :33 (catches missed primary)
    - cron: '33 */2 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      id-token: write
      contents: write    # need write to commit sent_history.json
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TO_EMAIL: yanxu2077@gmail.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard - skip if last email < 90min ago
        id: guard
        run: |
          if [ ! -f sent_history.json ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "no history yet, proceed"
            exit 0
          fi
          LAST=$(python3 -c "import json; h=json.load(open('sent_history.json')); print(h[-1]['sent_at'] if h else '')")
          if [ -z "$LAST" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "empty history, proceed"
            exit 0
          fi
          # Strip Z and fractional seconds for portable parsing
          LAST_CLEAN=$(echo "$LAST" | sed 's/\.[0-9]*Z*$//' | sed 's/Z$//')
          LAST_TS=$(date -u -d "${LAST_CLEAN}Z" +%s 2>/dev/null || echo 0)
          NOW_TS=$(date -u +%s)
          AGE=$((NOW_TS - LAST_TS))
          MIN_GAP=4500  # 75 min — tighter so 2h cadence backup fire still triggers
          echo "last sent: $LAST (${AGE}s ago)"
          if [ "$AGE" -lt "$MIN_GAP" ] && [ "$AGE" -gt "0" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Recent send (${AGE}s < ${MIN_GAP}s), skipping this fire"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch bioRxiv preprints
        if: steps.guard.outputs.skip != 'true'
        run: python fetch_papers.py > /tmp/biorxiv.json

      - name: Fetch PubMed journal articles
        if: steps.guard.outputs.skip != 'true'
        run: python fetch_pubmed.py > /tmp/pubmed.json

      - name: Combine sources
        if: steps.guard.outputs.skip != 'true'
        run: |
          python combine_sources.py > /tmp/papers.json
          python -c "import json; d=json.load(open('/tmp/papers.json')); print(f'combined: {d[\"count\"]} (window {d[\"window_utc\"]})')"

      - name: Claude picks paper + writes commentary
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 15 --model claude-sonnet-4-6 --allowed-tools "Read,Write,Bash"'
          prompt: |
            You are curating a daily research digest for a 3D genome / Micro-C / loop extrusion / single-molecule chromatin researcher (MIT). DO NOT mention "Hansen Lab" or "Hansen" anywhere.

            Reader's research interests:
              * Micro-C and high-resolution (sub-kb / nucleosome) contact maps
              * CTCF, cohesin, loop extrusion mechanism
              * Single-molecule live-cell imaging (SPT, SMLM, lattice light sheet)
              * Transcription factor dynamics, chromatin binding kinetics
              * Polymer physics of chromatin, bridging-induced phase separation
              * RNA Pol II clusters / biomolecular condensates
              * TAD / loop / compartment / chromatin domain biology

            TASK: pick TWO papers — one preprint + one journal article.

            1. Read /tmp/papers.json — fields: {title, authors, date, doi, url, category, abstract, source}. `source` is either "bioRxiv" (preprint) or "PubMed" (journal article).
            2. Read sent_history.json — list of already-emailed DOIs. EXCLUDE any paper whose `doi` matches an entry in sent_history.

            3. STRICT TIER DEFINITIONS (BE HONEST, DO NOT INFLATE — a Tier 4 day is normal):
               - **Tier 1**: title OR abstract explicitly contains: Hi-C, Micro-C, loop extrusion, cohesin (chromatin context), CTCF, TAD/topologically associating, "3D genome", chromosome conformation, chromatin loop, A/B compartment, condensin (chromatin context). Paper's CENTRAL contribution is chromatin spatial organization. Generic "chromatin remodeling" or "chromatin accessibility" alone does NOT qualify.
               - **Tier 2**: central topic is single-molecule chromatin imaging, condensates in nuclear context, TF binding kinetics, polymer modeling of chromatin, enhancer-promoter contacts, RNA Pol II clustering. Must be CHROMATIN-related.
               - **Tier 3**: broader chromatin / gene regulation / nuclear org without 3D focus (histone marks, nucleosome biology, ATAC/ChIP methods).
               - **Tier 4**: everything else.
               Within a tier, prefer methods/tools > novel discoveries > incremental.

            4. Pick TWO papers (one from each source):
               - **PREPRINT**: highest-tier paper from `source == "bioRxiv"` not in sent_history
               - **JOURNAL**: highest-tier paper from `source == "PubMed"` not in sent_history
               If a source has 0 candidates after history exclusion, leave its files empty (the email step will skip that one).

            5. Write SIX plain-text files (no JSON, no escaping needed):

               PREPRINT:
               - /tmp/preprint_doi.txt — picked bioRxiv DOI (single line, nothing else); empty file if no preprint candidate
               - /tmp/preprint_tier.txt — single digit 1-4
               - /tmp/preprint_commentary.txt — 2-3 sentence Chinese 点评 (concrete, technical, no Hansen mention)

               JOURNAL:
               - /tmp/journal_doi.txt — picked PubMed DOI; empty if no journal candidate
               - /tmp/journal_tier.txt — single digit 1-4
               - /tmp/journal_commentary.txt — 2-3 sentence Chinese 点评

            Commentary guidelines (for both):
               * Briefly state method/finding
               * State concretely WHY it's worth the reader's time
               * Reference experimental approach / resolution / system, how it informs or contrasts Micro-C / single-molecule work
               * Avoid generic phrases ("值得一读", "很有意思")
               * 2-3 sentences MAX
               * DO NOT mention "Hansen Lab" or "Hansen"

            DO NOT send any email. Just write the 6 files and finish.

      - name: Send preprint email
        if: steps.guard.outputs.skip != 'true'
        run: python send_email.py preprint

      - name: Send journal email
        if: steps.guard.outputs.skip != 'true'
        run: python send_email.py journal

      - name: Update sent history and push
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_history.py
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add sent_history.json
          if git diff --staged --quiet; then
            echo "no history change to commit"
          else
            git commit -m "log sent paper $(date -u +%FT%TZ)"
            # claude-code-action overwrote git auth — reset to GITHUB_TOKEN for push
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: python notify_failure.py
